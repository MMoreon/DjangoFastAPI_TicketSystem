events {
    # Максимальное количество одновременных соединений на один рабочий процесс
    worker_connections 1024;
}

http {
    # Подключаем стандартные типы файлов (чтобы картинки отдавались как image/png, а не текст)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # по умолчанию в Nginx всего 1 МБ
    client_max_body_size 15M;

    server {
        listen 80;

        location ~ ^/(auth|api|tickets|admin)/ {
            proxy_pass http://TicketSystem:8000;
            
            # Передаем Django реальный адрес и хост клиента
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Скриншоты и медиафайлы Nginx отдает сам напрямую с диска
        location /media/ {
            alias /app/media/;
        }

        # Статику админки Django тоже отдает сам Nginx
        location /static/ {
            alias /app/static/;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://AlertFastAPI:8080;
            
            # заголовки для переключения протокола HTTP -> WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            
            # по умолчанию 60 сек
            proxy_read_timeout 3600s;
        }
    }

    server {
        listen 8080;
        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12; # Подсеть Docker
            deny all;
        }
    }
}


