services:
  web:
    build: .
    container_name: TicketSystem
    expose:
      - "8000"
    # без nginx
    # ports:  
    # - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: sh -c "python manage.py makemigrations authentication tickets; python manage.py migrate; python manage.py createsuperuser --noinput || true; python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: django_postgres_db
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD} 
    ports:
      - "5432:5432"
    volumes:
      - pg_data_secure:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d DjangoFastAPI"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    restart: always
    ports:
      - 15672:15672
      - 5672:5672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  fastapi_service:
    build: .
    container_name: AlertFastAPI
    restart: always
    expose:
      - "8080"
    # без nginx
    # ports:
    #   - "8080:8080"
    volumes:
      - .:/app
    env_file:
      - .env
    command: uvicorn fastapi_app:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      - db
      - rabbitmq

  ollama:
    image: ollama/ollama:latest
    container_name: helpdesk_ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  celery_worker:
    build: . 
    container_name: helpdesk_celery
    # --concurrency=1 гарантирует что задачи идут в нейросеть строго по очереди, не перегружая RAM
    command: celery -A auth_service worker -l info --concurrency=1
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: helpdesk_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media:/app/media:ro
    depends_on:
      - web
      - fastapi_service

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: helpdesk_nginx_exporter
    restart: always
    command:
      - "--nginx.scrape-uri=http://nginx:8080/stub_status"
    depends_on:
      - nginx

  celery-exporter:
    image: danihodovic/celery-exporter:latest
    container_name: helpdesk_celery_exporter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CE_BROKER_URL=${CELERY_BROKER_URL}
    depends_on:
      - rabbitmq

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: helpdesk_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: helpdesk_node_exporter
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: helpdesk_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - web
      - fastapi_service
      - nginx-exporter
      - cadvisor
      - node-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: helpdesk_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pg_data_secure:
  # django_media:
  rabbitmq_data:
  ollama_data:
  grafana_data:

