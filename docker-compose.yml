services:
  web:
    build: .
    container_name: TicketSystem
    ports: 
    - "8000:8000"
    volumes:
      - .:/app
      - django_media:/app/media
    env_file:
      - .env
    command: sh -c "python manage.py makemigrations authentication tickets; python manage.py migrate; python manage.py createsuperuser --noinput || true; python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: django_postgres_db
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD} 
    ports:
      - "5432:5432"
    volumes:
      - pg_data_secure:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d DjangoFastAPI"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    restart: always
    ports:
      - 15672:15672
      - 5672:5672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  fastapi_service:
    build: .
    container_name: AlertFastAPI
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    env_file:
      - .env
    command: uvicorn fastapi_app:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      - db
      - rabbitmq

  ollama:
    image: ollama/ollama:latest
    container_name: helpdesk_ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  celery_worker:
    build: . 
    container_name: helpdesk_celery
    # --concurrency=1 гарантирует что задачи идут в нейросеть строго по очереди, не перегружая RAM
    command: celery -A auth_service worker -l info --concurrency=1
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped


volumes:
  pg_data_secure:
  django_media:
  rabbitmq_data:
  ollama_data:

