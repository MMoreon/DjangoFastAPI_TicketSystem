services:
  web:
    build: .
    container_name: TicketSystem
    ports: 
    - "8000:8000"
    volumes:
      - .:/app
      - django_media:/app/media
    environment:
      - SUPERUSER_USERNAME=superadmin
      - SUPERUSER_EMAIL=admin@example.com
      - SUPERUSER_PASSWORD=superpass
      - DEBUG=1
      - DB_NAME=DjangoFastAPI
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_HOST=db
      - DB_PORT=5432
    command: sh -c "python manage.py migrate && python manage.py createsuperuser --noinput || true && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15
    container_name: django_postgres_db
    environment:
      POSTGRES_DB: DjangoFastAPI
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pg_data_secure:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d DjangoFastAPI"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data_secure:
  django_media:
